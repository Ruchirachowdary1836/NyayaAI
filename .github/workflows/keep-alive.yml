name: Keep API awake

# Render's free plan sleeps the API after 15 idle minutes, and waking it takes
# 30-60s+. Pinging /health every 10 minutes keeps sign-in fast.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -m 60 https://nyayaai-api-k9l9.onrender.com/health
