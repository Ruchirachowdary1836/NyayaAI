name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nyayaai_test
          POSTGRES_USER: nyayaai
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nyayaai -d nyayaai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check backend/app backend/tests evaluation scripts
          ruff format --check backend/app backend/tests evaluation scripts
      - name: Run backend tests (SQLite)
        run: pytest -q
      - name: Apply migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql://nyayaai:ci-only-password@localhost:5432/nyayaai_test
        run: |
          alembic upgrade head
          alembic upgrade head
          python -c "from backend.app.db.database import Database; import os; db = Database(os.environ['DATABASE_URL']); print(db.schema_revision()); assert db.schema_revision() == '0003_embedding_batches'"
      - name: Run database tests against PostgreSQL
        env:
          NYAYAAI_TEST_POSTGRES_URL: postgresql://nyayaai:ci-only-password@localhost:5432/nyayaai_test
        run: pytest -q backend/tests/test_postgres.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Test frontend
        run: npm test
        working-directory: frontend
