services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyayaai}
      POSTGRES_USER: ${POSTGRES_USER:-nyayaai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyayaai}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nyayaai}:${POSTGRES_PASSWORD:-nyayaai}@postgres:5432/${POSTGRES_DB:-nyayaai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-NyayaAI}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      ENABLED_RETRIEVERS: '${ENABLED_RETRIEVERS:-["bm25","dense","hybrid"]}'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nyayaai}
      POSTGRES_USER: ${POSTGRES_USER:-nyayaai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyayaai}
      OLLAMA_BASE_URL: http://ollama:11434
      GENERATOR_MODEL: ${GENERATOR_MODEL:-llama3.1:8b}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      mlflow:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    image: node:20-alpine
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow-db/mlflow.db --default-artifact-root /mlflow-artifacts
    volumes:
      - mlflow_db:/mlflow-db
      - mlflow_data:/mlflow-artifacts

volumes:
  postgres_data:
  frontend_node_modules:
  ollama_data:
  mlflow_db:
  mlflow_data:
