[project]
name = "nyayaai"
version = "0.1.0"
description = "Hybrid legal retrieval and question answering for Indian jurisprudence"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.1",
  "pydantic==2.8.2",
  "pydantic-settings==2.3.4",
  "sqlalchemy==2.0.34",
  "psycopg[binary]==3.2.1",
  "alembic==1.13.2",
  "PyYAML==6.0.2",
  "numpy==1.26.4",
  "scipy==1.16.2",
  "httpx==0.27.0",
  "python-multipart==0.0.9",
  "pyjwt==2.9.0",
  "pypdf==5.1.0",
]

[project.optional-dependencies]
# Dense and hybrid retrieval: sentence-transformer embeddings with a FAISS index.
dense = [
  "sentence-transformers==3.2.1",
  "faiss-cpu==1.9.0",
]
# Optional MLflow tracking for offline experiments (evaluation/run_experiment.py).
tracking = [
  "mlflow==2.15.1",
]
dev = [
  "pytest==8.3.2",
  "pytest-asyncio==0.23.8",
  "ruff==0.5.6",
  "mypy==1.10.0",
  "pre-commit==3.7.1",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "evaluation"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests", "evaluation/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["backend/app"]

[tool.mypy]
python_version = "3.11"
files = ["backend/app"]
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
show_missing = true
