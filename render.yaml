services:
  - type: web
    name: nyayaai-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: nyayaai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Must list the static site's public origin exactly (scheme + host, no trailing slash).
      - key: CORS_ORIGINS
        value: '["https://nyayaai-web.onrender.com"]'
      # Google Gemini through its OpenAI-compatible API. GENERATOR_API_KEY is entered in the
      # dashboard and is also used for embeddings unless EMBEDDING_API_KEY is set.
      - key: GENERATOR_PROVIDER
        value: openai
      - key: GENERATOR_MODEL
        value: gemini-2.0-flash
      - key: GENERATOR_API_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: GENERATOR_API_KEY
        sync: false
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: DATA_CHUNKS_PATH
        value: data/processed/chunks.jsonl
      - key: DATA_DOCUMENTS_PATH
        value: data/processed/documents.jsonl
      # Dense/hybrid use an embeddings API (no PyTorch on the instance). The corpus is
      # embedded once in the background and stored in PostgreSQL; /ready shows progress.
      - key: ENABLED_RETRIEVERS
        value: '["bm25","dense","hybrid"]'
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: EMBEDDING_BATCH_SIZE
        value: "50"
      - key: EMBEDDING_REQUESTS_PER_MINUTE
        value: "30"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: QA_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: UPLOAD_MAX_BYTES
        value: "5242880"

  - type: web
    name: nyayaai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Must match the API service's public URL; update it if Render assigns a different host.
      - key: VITE_API_BASE_URL
        value: https://nyayaai-api-k9l9.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: nyayaai-db
    databaseName: nyayaai
    user: nyayaai
    region: oregon
    plan: free
    postgresMajorVersion: "16"
