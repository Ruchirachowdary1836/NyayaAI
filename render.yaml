services:
  - type: web
    name: nyayaai-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nyayaai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://nyayaai-web.onrender.com"]'
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: DATA_CHUNKS_PATH
        value: data/processed/chunks.jsonl
      - key: DATA_DOCUMENTS_PATH
        value: data/processed/documents.jsonl

  - type: web
    name: nyayaai-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nyayaai-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: nyayaai-db
    databaseName: nyayaai
    user: nyayaai
    region: oregon
    plan: free
    postgresMajorVersion: "16"
